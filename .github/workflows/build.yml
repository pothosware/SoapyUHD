name: Build check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos_macports_build_job:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }} (macports)
    steps:
      - uses: actions/checkout@v7
      - uses: melusina-org/setup-macports@v1
      - name: Install ports
        run: port install SoapySDR py310-setuptools uhd-devel
        # Note: MacPorts uhd-devel depends on non-default boost181
      - name: Configure
        run:  BOOST_ROOT=/opt/local/libexec/boost/1.81 cmake -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos_homebrew_build_job:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }} (homebrew)
    steps:
      - uses: actions/checkout@v7
      - name: Setup tools
        run: brew install soapysdr uhd
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux_build_job:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup tools
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          sudo apt-get install -q -y libsoapysdr-dev libuhd-dev
      - name: Configure
        run: cmake -GNinja -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
